name: Market Strategy Automation

on:
  schedule:
    # Runs every 15 minutes during Indian Market Hours (approx. 4:00 AM - 10:00 AM UTC)
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch: # Allows you to trigger it manually for testing

permissions:
  contents: write  # This gives the bot permission to push code/files
jobs:
  trade_execution:
    runs-on: ubuntu-latest
    # ... rest of your code ...
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Change 3.9 to 3.11 here

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run All Strategies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python BSM_WithAdjoints.py || echo "BSM Script Failed"
          python MA50200.py || echo "MA Strategy Failed"
          python bot.py || echo "Bot Script Failed"
          
     

      - name: Save State
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add market_state.csv
          git commit -m "Update Market State" || exit 0
          git push
