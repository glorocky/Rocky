name: NSE_Stock_Bot

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5' # Runs every 15 mins during market hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # IMPORTANT: Allows saving the CSV file
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r requirements.txt

      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save State
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add market_state.csv
          git commit -m "Update Market State" || exit 0
          git push
