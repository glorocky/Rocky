name: Run Trading Bot
on:
  schedule:
    - cron: '15 3 * * 1-5' # 9:15 AM IST (Monday-Friday)
  workflow_dispatch:      # Allows manual runs

jobs:
  trade_execution:
    runs-on: ubuntu-latest
    # Place this at the JOB level to cover all actions
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6 # Upgraded version

      - name: Set up Python
        uses: actions/setup-python@v6 # Upgraded version
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up subsequent runs
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run All Strategies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python BSM_WithAdjoints.py
          python MA50200.py
          python bot.py

      - name: Save State
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add market_state.csv
          git commit -m "Update Market State" || exit 0
          git push
